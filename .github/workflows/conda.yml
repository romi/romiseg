# GitHub workflow that builds and publishes conda packages to Anaconda.org when releases are published or manually triggered.
name: Build & Publish Conda package

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  conda_build:
    name: Build conda package
    runs-on: ubuntu-latest
    environment: anaconda  # Sets the required deployment environment (for secrets)
    defaults:
      run:
        shell: bash -el {0}   # Use bash login shell to ensure conda environments are activated properly

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: "3.10"

      - name: Conda build
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          conda install conda-build anaconda-client
          conda config --set anaconda_upload yes
          # Build package from recipe directory and upload to Anaconda.org.
          # Note: use `conda-build` directly, as conda 26+ no longer exposes `conda build`.
          # `-c romi-eu` provides `plantdb.commons`. The `pytorch` channel is intentionally
          # omitted: only CUDA builds are published there, which can't solve on GPU-less runners.
          conda-build conda/recipe/meta.yaml -c conda-forge -c romi-eu --user romi-eu --token ${{ secrets.ANACONDA_TOKEN }}
