# GitHub workflow that runs the deterministic unit tests in `tests/` on every pull request.
#
# Only fast, self-contained unit tests are run. Model-dependent and integration tests
# (`test_segmentation`, `test_unet`, `test_unet3d`) are intentionally excluded: they
# download pretrained weights / test databases and are not suitable for a CI run.

name: Run unit tests

on:
  pull_request:

jobs:
  tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run unit tests
        working-directory: tests
        run: python -m unittest test_datasets test_transforms -v
